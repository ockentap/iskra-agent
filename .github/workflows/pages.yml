name: Deploy Iskra site to Pages

on:
  push:
    branches: [iskra-rebrand]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      - 'plugin-catalog/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish so Pages never serves a
# half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Python (for catalog/llms extraction)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction deps
        run: python -m pip install --quiet ruamel.yaml httpx

      - name: Install dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Build Docusaurus
        working-directory: website
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4