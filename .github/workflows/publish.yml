name: iskra-image

# Builds the container image and pushes it to GHCR.
# Private repo: runs draw from the plan's included Actions minutes.
# Public image or private, container storage/bandwidth on GHCR is free today.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The standard private-repo runner has ~14 GB of free disk; this image is
      # 3-4 GB built, so clear the preinstalled toolchains before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

# On the target box:
#   echo "$GHCR_PAT" | docker login ghcr.io -u ockentap --password-stdin
#   docker compose pull && docker compose up -d
# PAT needs read:packages only. In Actions, GITHUB_TOKEN is enough to push.
